<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <title>Gestor de Notas</title>
  </head>
  <body class="bg-black text-white">
    <main class="container g-10 d-flex flex-column ">
        <section class="mb-*">
            <h1 >Notas</h1>
        </section>
        <section class="formulario container-fluid d-flex flex-column align-items-center p-2 mb-2">
            <div class="mb-3 w-100" >
                <label for="txtNombre" class="form-label">Nombre de la nota</label>
                <input type="text" class="form-control" id="txtNombre" placeholder="Lista de compras">
            </div>
            <div class="mb-3 w-100">
                <label for="txtCuerpo" class="form-label">Contenido de la nota</label>
                <textarea class="form-control" id="txtCuerpo" rows="4" placeholder="Compras de la semana"></textarea>
            </div>
            <button type="button" id="btnGuardar" class="btn btn-secondary">Guardar</button>
            </button>
        </section>
        <section class="notas mb-2">
            <h3>Elementos guardados</h3>
            <ul class="list-group" id="listaNotas"></ul>
        </section>
        <section class="resumen d-flex flex-column align-items-center p-2" style="display: none">
            <div class="card w-50">
                <div class="card-body">
                  <h5 class="card-title" id="tituloNota">Ninguno</h5>
                  <h6 class="card-subtitle mb-2 text-body-secondary"></h6>
                  <p class="card-text" id="cuerpoNota">Ingrese alguna nota</p>
                </div>
              </div>
        </section>

    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
    <script src="./Script/index.js"></script>
    <!-- <script src="./Script/gestorNotas.js"></script> -->
  </body>
</html>
